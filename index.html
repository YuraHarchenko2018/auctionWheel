<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="container">
        <canvas id="canvas" width="800" height="800"></canvas>
        <div id="controls">
            <span id="winnerLabel">
                Winner: 
                <div id="winnerDisplay">None</div>
            </span>
            <div id="spinControls">
                <button id="spinButton">Spin</button>
                <input type="number" id="durationInput" value="10" min="1" placeholder="Duration"/>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
