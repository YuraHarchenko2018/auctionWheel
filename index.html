<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="wrapper">
        <div id="wheelContainer">
            <canvas id="canvas" width="800" height="800"></canvas>
            <div id="controls">
                <span id="winnerLabel">
                    Winner: 
                    <div id="winnerDisplay">None</div>
                </span>
                <div id="spinControls">
                    <button id="spinButton">Spin</button>
                    <input type="number" id="durationInput" value="10" min="1" placeholder="Duration"/>
                </div>
            </div>
        </div>
        <div class="dataContainer">
            <div class="addOptionPanel">
                <input type="text" class="optionLabelInput" id="optionLabelInput" placeholder="Option Label"/>
                <input type="number" class="optionPriceInput" id="optionPriceInput" placeholder="Option Price"/>
                <button class="addOptionButton" id="addOptionButton">Add Option</button>
            </div>
            <div class="optionsList" id="optionsList">
                <!-- Options will be dynamically added here -->
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
